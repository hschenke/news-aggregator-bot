name: Update RSS Feeds to CDN

on:
  push:
    paths:
      - 'config/sources.yaml'
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Quellcode auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pyyaml requests

      - name: 📡 RSS-Feeds neu generieren
        run: |
          python -c "from src.aggregator import collect_all_news; collect_all_news()"

      - name: 🚀 Aktualisierte RSS-Feeds zu GitHub / CDN pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/rss/
          if git diff --staged --quiet; then
            echo "Keine Änderungen in den RSS-Feeds vorhanden."
          else
            git commit -m "chore(rss): rebuild and update RSS feeds for CDN [skip ci]"
            target_branch="${{ github.head_ref || github.ref_name }}"
            git pull --rebase origin "$target_branch"
            git push origin "HEAD:$target_branch"
            echo "RSS-Feeds erfolgreich zu GitHub und CDN gepusht!"
          fi
